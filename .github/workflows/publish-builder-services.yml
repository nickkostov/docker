name: Publish Builder service images
run-name: Publish ${{ inputs.service }}${{ inputs.version && format(':{0}', inputs.version) || ':all' }} with Builder

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service image
        required: true
        type: choice
        options:
          - actions-runner
        default: actions-runner
      version:
        description: Optional version; leave blank to publish every configured version
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-builder-service-${{ inputs.service }}-${{ inputs.version || 'all' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve selected collection
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          case "$SERVICE" in
            actions-runner) definition=images/services/action-runners/images.yaml ;;
            *) echo "Unsupported Builder service: $SERVICE" >&2; exit 1 ;;
          esac
          echo "BUILDER_DEFINITION=$definition" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Builder
        run: python3 -m pip install .

      - name: Validate selected collection
        run: builder validate "$BUILDER_DEFINITION"

      - name: Build and publish
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          builder_args=(build "$BUILDER_DEFINITION" --ci)
          if [[ -n "$VERSION" ]]; then
            builder_args+=(--version "$VERSION")
          fi
          builder "${builder_args[@]}"
