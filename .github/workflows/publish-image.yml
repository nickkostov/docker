name: Publish container image

on:
  workflow_dispatch:
    inputs:
      metadata:
        description: Path to image.yaml
        required: true
        type: choice
        default: images/base/debian/11/image.yaml
        options:
          - images/base/alpine/3.21/image.yaml
          - images/base/alpine/3.22/image.yaml
          - images/base/alpine/3.23/image.yaml
          - images/base/alpine/3.24/image.yaml
          - images/base/busybox/1.36.0/image.yaml
          - images/base/busybox/1.36.1/image.yaml
          - images/base/busybox/1.37.0/image.yaml
          - images/base/busybox/1.38.0/image.yaml
          - images/base/debian/11/image.yaml
          - images/base/debian/12/image.yaml
          - images/base/debian/13/image.yaml
          - images/base/ubuntu/20.04/image.yaml
          - images/base/ubuntu/22.04/image.yaml
          - images/base/ubuntu/24.04/image.yaml
          - images/base/ubuntu/26.04/image.yaml
          - images/frameworks/react/image.yaml
          - images/frameworks/vite/image.yaml
          - images/runtimes/java/21/image.yaml
          - images/runtimes/node/22/image.yaml
          - images/runtimes/python/3.13/image.yaml
          - images/services/nginx/image.yaml

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read image metadata
        id: image
        env:
          METADATA: ${{ inputs.metadata }}
        run: |
          set -euo pipefail
          test -f "$METADATA"
          directory=${METADATA%/image.yaml}
          name=$(awk '$1 == "name:" {print $2; exit}' "$METADATA")
          repository=$(awk '$1 == "repository:" {print $2; exit}' "$METADATA")
          if [ -z "$repository" ]; then
            repository=$(sed -n 's/.*repository:[[:space:]]*\([^,}]*\).*/\1/p' "$METADATA" | head -1 | tr -d '"')
          fi
          upstream_image=$(awk '$1 == "image:" {print $2; exit}' "$METADATA")
          upstream_tag=$(awk '$1 == "tag:" {print $2; exit}' "$METADATA")
          upstream_digest=$(awk '$1 == "digest:" {print $2; exit}' "$METADATA")
          test -n "$name" -a -n "$repository" -a -n "$upstream_image" -a -n "$upstream_tag" -a -n "$upstream_digest"
          [[ "$upstream_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Metadata contains no verified upstream digest" >&2; exit 1; }
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream_image@$upstream_digest" >> "$GITHUB_OUTPUT"
          version=$(awk '$1 == "version:" {print $2; exit}' "$METADATA" | tr -d '"')
          timestamp=$(date -u -d "${{ github.run_started_at }}" +%Y%m%d-%H%M%S)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version-$timestamp" >> "$GITHUB_OUTPUT"
          echo "Generated immutable tag: $version-$timestamp"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ steps.image.outputs.directory }}
          file: ${{ steps.image.outputs.directory }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
          build-args: |
            UPSTREAM_IMAGE=${{ steps.image.outputs.upstream }}
            VERSION=${{ steps.image.outputs.version }}
            BUILD_DATE=${{ github.run_started_at }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          sbom: true
          provenance: mode=max
