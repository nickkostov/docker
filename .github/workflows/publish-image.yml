name: Publish base image
run-name: Publish base image ${{ inputs.os }}:${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      image_type:
        description: Image type
        required: true
        type: choice
        options: [base]
        default: base
      os:
        description: Operating system, runtime, or framework family
        required: true
        type: choice
        options: [alpine, busybox, debian, ubuntu]
        default: ubuntu
      version:
        description: Version matching the selected image family
        required: true
        type: string
        default: "20.04"

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  prepare:
    runs-on: docker-ubuntu-2404
    outputs:
      image_type: ${{ steps.image.outputs.image_type }}
      directory: ${{ steps.image.outputs.directory }}
      repository: ${{ steps.image.outputs.repository }}
      upstream: ${{ steps.image.outputs.upstream }}
      version: ${{ steps.image.outputs.version }}
      tag: ${{ steps.image.outputs.tag }}
      build_date: ${{ steps.image.outputs.build_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image definition
        id: image
        env:
          IMAGE_TYPE: ${{ inputs.image_type }}
          OS: ${{ inputs.os }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          publish_version="$VERSION"
          case "$IMAGE_TYPE/$OS/$VERSION" in
            base/alpine/3.21) metadata=images/base/alpine/3.21/image.yaml ;;
            base/alpine/3.22) metadata=images/base/alpine/3.22/image.yaml ;;
            base/alpine/3.23) metadata=images/base/alpine/3.23/image.yaml ;;
            base/alpine/3.24) metadata=images/base/alpine/3.24/image.yaml ;;
            base/busybox/1.36.0) metadata=images/base/busybox/1.36.0/image.yaml ;;
            base/busybox/1.36.1) metadata=images/base/busybox/1.36.1/image.yaml ;;
            base/busybox/1.37.0) metadata=images/base/busybox/1.37.0/image.yaml ;;
            base/busybox/1.38.0) metadata=images/base/busybox/1.38.0/image.yaml ;;
            base/debian/11) metadata=images/base/debian/11/image.yaml ;;
            base/debian/12) metadata=images/base/debian/12/image.yaml ;;
            base/debian/13) metadata=images/base/debian/13/image.yaml ;;
            base/ubuntu/20.04) metadata=images/base/ubuntu/20.04/image.yaml ;;
            base/ubuntu/22.04) metadata=images/base/ubuntu/22.04/image.yaml ;;
            base/ubuntu/24.04) metadata=images/base/ubuntu/24.04/image.yaml ;;
            base/ubuntu/26.04) metadata=images/base/ubuntu/26.04/image.yaml ;;
            *) echo "Unsupported image selection: $IMAGE_TYPE/$OS/$VERSION" >&2; exit 1 ;;
          esac

          directory=${metadata%/image.yaml}
          repository=$(awk '$1 == "repository:" {print $2; exit}' "$metadata")
          upstream_image=$(awk '$1 == "image:" {print $2; exit}' "$metadata")
          upstream_digest=$(awk '$1 == "digest:" {print $2; exit}' "$metadata")
          test -n "$repository" -a -n "$upstream_image" -a -n "$upstream_digest"
          [[ "$upstream_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Metadata contains no verified upstream digest" >&2; exit 1; }

          timestamp=$(date -u +%Y%m%d-%H%M%S)
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "image_type=$IMAGE_TYPE"
            echo "directory=$directory"
            echo "repository=$repository"
            echo "upstream=$upstream_image@$upstream_digest"
            echo "version=$publish_version"
            echo "tag=$publish_version-$timestamp"
            echo "build_date=$build_date"
          } >> "$GITHUB_OUTPUT"

  publish-base:
    if: needs.prepare.outputs.image_type == 'base'
    needs: prepare
    uses: ./.github/workflows/publish-one-image.yml
    with:
      directory: ${{ needs.prepare.outputs.directory }}
      repository: ${{ needs.prepare.outputs.repository }}
      upstream: ${{ needs.prepare.outputs.upstream }}
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      build_date: ${{ needs.prepare.outputs.build_date }}
    secrets: inherit
