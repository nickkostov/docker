name: Validate approved base image

on:
  workflow_call:
    inputs:
      dockerfile:
        type: string
        required: false
        default: Dockerfile

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: docker-ubuntu-2604
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract base images
        run: |
          set -euo pipefail
          awk 'toupper($1) == "FROM" { for (i = 2; i <= NF; i++) if ($i !~ /^--/) { print $i; break } }' "${{ inputs.dockerfile }}" > /tmp/base-images.txt
      - name: Validate registry
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            case "$image" in
              ghcr.io/nickkostov/docker/*) ;;
              *) echo "::error::Unapproved base image: $image"; exit 1 ;;
            esac
          done < /tmp/base-images.txt
