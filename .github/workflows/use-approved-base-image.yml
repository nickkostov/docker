name: Validate approved base image

on:
  workflow_call:
    inputs:
      dockerfile:
        type: string
        required: false
        default: Dockerfile

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Extract base images
        run: |
          set -euo pipefail
          awk 'toupper($1) == "FROM" { for (i = 2; i <= NF; i++) if ($i !~ /^--/) { print $i; break } }' "${{ inputs.dockerfile }}" > /tmp/base-images.txt
      - name: Validate registry
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            case "$image" in
              ghcr.io/example-org/base-images/*) ;;
              *) echo "::error::Unapproved base image: $image"; exit 1 ;;
            esac
          done < /tmp/base-images.txt
