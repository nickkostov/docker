name: Validate container images

on:
  pull_request:
    paths: ["images/**", "policies/**", "schemas/**", "scripts/**", "src/**", "tests/**", ".github/workflows/**", "Makefile", "pyproject.toml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: docker-ubuntu-2604
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install repository tooling
        run: python3 -m pip install .
      - name: Validate YAML and schema behavior
        run: python3 -m unittest discover -s tests
      - name: Validate metadata and Dockerfiles
        run: make validate
