name: Publish Runtime Image
run-name: Publish Runtime image ${{ inputs.base_os }}, ${{ inputs.runtime }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Runtime family
        required: true
        type: choice
        options: [node]
        default: node
      version:
        description: Node.js version
        required: true
        type: choice
        options: ["22", "24"]
        default: "22"
      base_os:
        description: Organization OS base
        required: true
        type: choice
        options: [alpine, ubuntu]
        default: alpine
      base_version:
        description: Organization OS version
        required: true
        type: string
        default: "3.21"

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      directory: ${{ steps.image.outputs.directory }}
      repository: ${{ steps.image.outputs.repository }}
      upstream: ${{ steps.image.outputs.upstream }}
      base_image: ${{ steps.image.outputs.base_image }}
      version: ${{ steps.image.outputs.version }}
      tag: ${{ steps.image.outputs.tag }}
      moving_tag: ${{ steps.image.outputs.moving_tag }}
      build_date: ${{ steps.image.outputs.build_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve runtime matrix entry
        id: image
        env:
          RUNTIME: ${{ inputs.runtime }}
          VERSION: ${{ inputs.version }}
          BASE_OS: ${{ inputs.base_os }}
          BASE_VERSION: ${{ inputs.base_version }}
        run: |
          set -euo pipefail
          values=$(ruby -ryaml -e '
            data = YAML.load_file("images/runtimes/node/versions.yaml")
            entry = data.fetch("runtime_versions").fetch(ENV.fetch("VERSION")).fetch(ENV.fetch("BASE_OS")).fetch(ENV.fetch("BASE_VERSION"))
            puts [entry.fetch("base_repository"), entry.fetch("base_digest"), entry.fetch("upstream_image"), entry.fetch("upstream_tag"), entry.fetch("upstream_digest")].join("\t")
          ')
          IFS=$'\t' read -r base_repository base_digest upstream_image upstream_tag upstream_digest <<< "$values"
          [[ "$base_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "OS base digest is not verified" >&2; exit 1; }
          [[ "$upstream_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Node upstream digest is not verified" >&2; exit 1; }
          timestamp=$(date -u +%Y%m%d-%H%M%S)
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "directory=images/runtimes/node"
            echo "repository=ghcr.io/nickkostov/base-images/node"
            echo "upstream=$upstream_image@$upstream_digest"
            echo "base_image=$base_repository@$base_digest"
            echo "version=$VERSION"
            echo "tag=$VERSION-$BASE_OS$BASE_VERSION-$timestamp"
            echo "moving_tag=$VERSION-$BASE_OS$BASE_VERSION"
            echo "build_date=$build_date"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR to verify OS dependency
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify OS image exists
        env:
          BASE_IMAGE: ${{ steps.image.outputs.base_image }}
        run: docker buildx imagetools inspect "$BASE_IMAGE"

  publish-runtime:
    needs: prepare
    uses: ./.github/workflows/publish-one-image.yml
    with:
      directory: ${{ needs.prepare.outputs.directory }}
      repository: ${{ needs.prepare.outputs.repository }}
      upstream: ${{ needs.prepare.outputs.upstream }}
      base_image: ${{ needs.prepare.outputs.base_image }}
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      moving_tag: ${{ needs.prepare.outputs.moving_tag }}
      build_date: ${{ needs.prepare.outputs.build_date }}
    secrets: inherit
